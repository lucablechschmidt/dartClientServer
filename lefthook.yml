# Git hooks, installed by `npm install` (lefthook's postinstall). Skip once with LEFTHOOK=0 git commit …
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,mjs,js,json,css}"
      run: npx prettier --check {staged_files}
    lint:
      glob: "*.{ts,tsx,mjs}"
      run: npx eslint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
