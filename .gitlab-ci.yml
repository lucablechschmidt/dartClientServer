# Just a call to scripts/ci.sh (architecture.md E15). The Playwright image ships Node and Chromium;
# its version must match @playwright/test in package.json.
image: mcr.microsoft.com/playwright:v1.64.1-noble

stages: [check]

variables:
  NPM_CACHE: "$CI_PROJECT_DIR/.npm"
  SMOKE_OUT: "$CI_PROJECT_DIR/ci-screenshots"

check:
  stage: check
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [.npm/]
  script:
    - ./scripts/ci.sh
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [ci-screenshots/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
